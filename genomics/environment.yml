name: genomic-analysis

channels:
  - conda-forge
  - bioconda

dependencies:
  # Python
  - python=3.11

  # Java
  - openjdk=17

  # Quality control
  - fastqc
  - fastp
  - multiqc

  # Data retrieval
  - sra-tools
  - aria2
  - wget
  - curl

  # Alignment
  - bwa-mem2

  # BAM/SAM processing
  - samtools
  - picard
  - mosdepth

  # Variant calling and manipulation
  - gatk4
  - bcftools
  - htslib
  - tabix

  # Structural variants

  # Functional annotation
  - ensembl-vep

  # Genomic utilities
  - bedtools
  - seqkit

  # Compression
  - pigz
