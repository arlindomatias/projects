name: genomic-variants
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake
  - mamba  # default conda frontend for `snakemake --use-conda`
  # pipeline tools (GATK and SnpEff are not here: Snakemake builds them from
  # envs/gatk.yaml and envs/annotation.yaml)
  - fastp
  - bwa
  - samtools
  - bcftools
  - htslib
  - rtg-tools
  # downstream analysis (Python)
  - cyvcf2
  - pysam
  - pandas
  - numpy
  - scikit-allel
  - matplotlib
  - jupyterlab
