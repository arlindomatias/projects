# Reference genome (GRCh38). Contig names must match the truth set (GIAB GRCh38 uses "chr20").
reference: "ref/GRCh38.fa"

# Restrict calling and benchmarking to one region to keep runtime low.
region: "chr20"

# GIAB HG002 benchmark (v4.2.1, GRCh38): bgzipped + tabix-indexed VCF and high-confidence BED.
truth_vcf: "truth/HG002_GRCh38_benchmark.vcf.gz"
truth_bed: "truth/HG002_GRCh38_benchmark.bed"

# bcftools filter expression: variants matching it are removed.
# GATK recommended hard filters (separate thresholds for SNVs and indels),
# without the SNV "INFO/MQ<40" term: on HG002 chr20 it alone removed ~400 true SNVs.
# Missing annotations (e.g. MQRankSum at hom-alt sites) do not trigger removal.
# Previous filter: "QUAL<20 || FORMAT/DP<10"
filter: >-
  (TYPE="snp" && (INFO/QD<2 || QUAL<30 || INFO/SOR>3 || INFO/FS>60
  || INFO/MQRankSum<-12.5 || INFO/ReadPosRankSum<-8))
  || (TYPE="indel" && (INFO/QD<2 || QUAL<30 || INFO/FS>200 || INFO/ReadPosRankSum<-20))

# Raw reads live outside the repo, under $DATA (expanded by the Snakefile).
# HG002 chr20 reads extracted from GIAB HG002.GRCh38.60x.1.bam (NHGRI novoalign, HiSeq 2x148, ~60x).
samples:
  HG002:
    r1: "$DATA/GIAB_HG002/HG002_chr20_R1.fastq.gz"
    r2: "$DATA/GIAB_HG002/HG002_chr20_R2.fastq.gz"

# SnpEff annotation database (Ensembl GRCh38) and where its files are stored (outside the repo).
snpeff_db: "GRCh38.115"
snpeff_data_dir: "$DATA/snpEff_data"

# DeepVariant Docker image (run via `docker run` in the deepvariant rule).
deepvariant_image: "google/deepvariant:1.10.0"
