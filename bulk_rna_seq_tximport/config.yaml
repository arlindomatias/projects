# ============================================================
# Configuração do dataset. Para outro dataset, trocar este arquivo
# (ou passar outro com `snakemake --configfile outro.yaml`).
# ============================================================

dataset: GSE295281
title: "AC-T vs Saline (hipocampo, 1 mês após o tratamento)"

# Saídas do projeto ../salmon (tximport, nível gene).
input:
  txi: ../salmon/results/txi_gene.rds        # lista do tximport: counts, abundance, length
  samples: ../salmon/samples.tsv             # uma linha por amostra
  tx2gene: ../salmon/results/tx2gene.tsv     # transcript_id, gene_id, gene_name, ...

samples:
  id_column: run              # deve bater com colnames(txi$counts)
  condition_column: condition # coluna com o grupo experimental
  label_column: mouse_id      # rótulo curto para gráficos (null = usar o id)

# Nome bruto em `condition_column` -> rótulo usado no modelo.
# Os rótulos precisam ser nomes válidos em R (sem hífen), senão o coeficiente do DESeq2 muda de nome.
groups:
  labels:
    Saline: Saline
    AC-T: ACT
  reference: Saline
  treatment: ACT
  colors:
    Saline: "#3399FF"
    ACT: "#CC0000"

# Colunas de samples.tsv somadas ao modelo antes do grupo (~ cov1 + cov2 + group).
# Atenção: no GSE295281 a gaiola/lote (1º dígito do mouse_id) está aninhada no grupo e não pode entrar.
covariates: []

# Amostras (ids) removidas da análise. Ex.: [SRR33247678]
exclude_samples: []

filter:
  min_count: 10
  min_samples: null   # null = tamanho do menor grupo

de:
  fit_type: local
  padj: 0.05
  lfc: 0.5            # |log2FC| mínimo para DEG

plots:
  heatmap_max_genes: 50
  # Genes mostrados em plots/marker_genes.png (contagens normalizadas por amostra).
  # Xist: todas as fêmeas devem expressar; Ddx3y: deve ser ~0.
  marker_genes: [Xist, Ddx3y, Gfap, Aif1, Mbp]

enrichment:
  organism_kegg: mmu
  orgdb: org.Mm.eg.db
  min_gs_size: 10
  max_gs_size: 800
  pvalue_cutoff: 0.05
  string_version: "12.0"
  string_species: 10090
  string_score: 700
  string_cache: cache/
  # Vias para o pathview. Lista vazia = as `pathview_top_n` vias KEGG mais significativas.
  pathview_pathways: []
  pathview_top_n: 3

seed: 123
