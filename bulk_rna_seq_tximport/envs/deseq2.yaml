# Mesmo conjunto de pacotes do bulk-rna-seq (environment.yml), sem GEOquery/readxl.
# As versões exatas estão em deseq2.linux-64.pin.txt (cópia do lock do bulk-rna-seq),
# que o Snakemake usa no lugar deste arquivo em linux-64.
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.5.3
  - r-ggplot2
  - r-readr
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-stringr
  - r-pheatmap
  - r-ggrepel
  - r-ggridges
  - r-ggforce
  - r-shadowtext
  - r-qqman
  - r-patchwork
  - r-igraph
  - r-ggtangle=0.1.4
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-enhancedvolcano
  - bioconductor-summarizedexperiment
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-dose
  - bioconductor-org.mm.eg.db
  - bioconductor-pathview
  - bioconductor-reactomepa
  - bioconductor-stringdb
