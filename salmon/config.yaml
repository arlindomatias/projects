# Subdiretório de $DATA onde ficam os arquivos grandes (fastq, referência, índice, saídas do Salmon).
data_subdir: GSE295281

# FASTQ temporários (~25 GB/amostra) no SSD local: o HD mecânico satura com fasterq-dump (testado em 2026-11-12).
# São apagados pelo Snakemake após FastQC + Salmon; nada permanente fica aqui.
fastq_scratch: ~/scratch/GSE295281

samples: samples.tsv

gencode_release: M35
transcriptome_url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_mouse/release_M35/gencode.vM35.transcripts.fa.gz

# Amostra é reprovada se o mapping rate do Salmon ficar abaixo disso (%).
min_mapping_rate: 30

threads:
  # salmon < --cores: assim o Salmon roda junto com fasterq-dump/FastQC em vez de esperar todos os núcleos livres.
  salmon: 6
  fastqc: 1
  fasterq_dump: 4
